# House of Rose — Sanity Studio
# Netlify site: house-of-rose-studio (44c4d348-8afd-4c0d-adb2-f8f9b7ffde15)
# Custom domain: studio.houseofrosefl.com
#
# NOTE: Base directory NOT required in Netlify UI — publish path is absolute from repo root

[build]
  # --workspace flag ensures only the studio package is built, not the whole monorepo
  command   = "npm install && npm run build -w @house-of-rose/studio"
  publish   = "packages/studio/dist"

[build.environment]
  # Sanity Studio v6 requires Node >=22.12
  NODE_VERSION = "22"

# Security headers for the Studio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Studio must be embeddable in its own origin only
    X-Frame-Options        = "SAMEORIGIN"

# SPA fallback — Studio is a React SPA; all paths serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
