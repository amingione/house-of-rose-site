.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;house-of-rose-ad-kit&quot; class=&quot;hor-shell&quot;&gt;
  &lt;style&gt;
    #house-of-rose-ad-kit {
      --hor-gap: clamp(1rem, 3vw, 2rem);
      display: grid;
      gap: var(--hor-gap);
      width: 100%;
      color: var(--foreground);
    }
    #house-of-rose-ad-kit .hor-hero {
      display: grid;
      grid-template-columns: minmax(250px, 0.8fr) minmax(300px, 1.2fr);
      gap: var(--hor-gap);
      align-items: start;
    }
    #house-of-rose-ad-kit .hor-creative {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0.5rem;
    }
    #house-of-rose-ad-kit .hor-copy-stack,
    #house-of-rose-ad-kit .hor-fields {
      display: grid;
      gap: 1rem;
    }
    #house-of-rose-ad-kit .hor-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    #house-of-rose-ad-kit .hor-section-head h2,
    #house-of-rose-ad-kit .hor-section-head h3 {
      margin: 0;
    }
    #house-of-rose-ad-kit .hor-caption {
      width: 100%;
      min-height: 30rem;
      resize: vertical;
    }
    #house-of-rose-ad-kit .hor-field-copy {
      width: 100%;
      min-height: 5.5rem;
      resize: vertical;
    }
    #house-of-rose-ad-kit .hor-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    #house-of-rose-ad-kit .hor-meta-grid .hor-wide {
      grid-column: 1 / -1;
    }
    #house-of-rose-ad-kit .hor-note {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    #house-of-rose-ad-kit .hor-note svg {
      width: 1.25rem;
      height: 1.25rem;
      flex: 0 0 auto;
      margin-top: 0.1rem;
    }
    #house-of-rose-ad-kit .hor-note p {
      margin: 0;
    }
    #house-of-rose-ad-kit .hor-status {
      min-height: 1.25rem;
      margin: 0;
    }
    @media (max-width: 680px) {
      #house-of-rose-ad-kit .hor-hero,
      #house-of-rose-ad-kit .hor-meta-grid {
        grid-template-columns: 1fr;
      }
      #house-of-rose-ad-kit .hor-meta-grid .hor-wide {
        grid-column: auto;
      }
      #house-of-rose-ad-kit .hor-caption {
        min-height: 34rem;
      }
    }
  &lt;/style&gt;
