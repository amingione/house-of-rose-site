name: Notify Notion departments

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify-notion:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          fi
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node << 'JS'
          const changedFiles = `${{ steps.files.outputs.changed }}`.split('\n').filter(Boolean);
          const departments = [
      {
            "name": "Astro Web",
            "pageId": "3655676d-e399-812b-90ac-c43893963a4d",
            "paths": [
                  "packages/web/src/pages",
                  "packages/web/src/components",
                  "packages/web/src/lib"
            ]
      },
      {
            "name": "Sanity Studio",
            "pageId": "3655676d-e399-8102-8045-c21e8b4f3f4f",
            "paths": [
                  "packages/studio/schemas",
                  "packages/studio/sanity.config"
            ]
      },
      {
            "name": "Deploy & Infra",
            "pageId": "3655676d-e399-8166-93a9-e1b52d1fcb4b",
            "paths": [
                  "netlify.toml",
                  "packages/web/netlify.toml"
            ]
      }
];

          const author = process.env.GITHUB_ACTOR;
          const isPR = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const title = isPR
            ? process.env.GITHUB_HEAD_REF + ' → main'
            : (process.env.GITHUB_EVENT_PATH ? require('fs').readFileSync(process.env.GITHUB_EVENT_PATH,'utf8') : '')
              .replace(/[\s\S]*"message"\s*:\s*"([^"\\n]*)[\s\S]*/,'$1') || 'Push to main';
          const sha = process.env.GITHUB_SHA?.slice(0,7);
          const runUrl = `https://github.com/${{ github.repository }}/commit/${{ github.sha }}`;

          const matched = departments.filter(d =>
            changedFiles.some(f => d.paths.some(p => f.includes(p)))
          );

          if (!matched.length) {
            console.log('No departments matched for files:', changedFiles.join(', '));
            process.exit(0);
          }

          const ts = new Date().toLocaleDateString('en-US', {year:'numeric',month:'short',day:'numeric'});
          const token = process.env.NOTION_TOKEN;

          for (const dept of matched) {
            const files = changedFiles.filter(f => dept.paths.some(p => f.includes(p)));
            const content = `${ts} | ${sha} | by ${author}\nFiles: ${files.slice(0,5).join(', ')}\n${runUrl}`;
            const r = await fetch(`https://api.notion.com/v1/blocks/${dept.pageId}/children`, {
              method: 'PATCH',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'Notion-Version': '2022-06-28'
              },
              body: JSON.stringify({
                children: [{
                  object: 'block', type: 'paragraph',
                  paragraph: { rich_text: [{ type: 'text', text: { content } }] }
                }]
              })
            });
            console.log(`${dept.name}: ${r.status}`);
          }
          JS
