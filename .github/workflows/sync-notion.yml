name: Publish content (Notion → site)

# Optional FREE fallback button. The real sync runs inside the Netlify build
# (scripts/netlify-content-sync.mjs); this workflow just pokes the same Netlify
# content build hook, so it behaves exactly like ticking the Notion checkbox.
#
# Trigger it from the Actions tab → "Run workflow", or leave it unused if you
# only ever publish via the Notion checkbox / Zap.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-notion]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify content build hook
        env:
          NETLIFY_CONTENT_HOOK_URL: ${{ secrets.NETLIFY_CONTENT_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_CONTENT_HOOK_URL" ]; then
            echo "Missing NETLIFY_CONTENT_HOOK_URL secret."; exit 1
          fi
          curl -fsSL -X POST "$NETLIFY_CONTENT_HOOK_URL" && echo "Netlify content build triggered."
