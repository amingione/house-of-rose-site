            - paragraph [ref=e94]: PRF is a platelet concentrate prepared from a small sample of your own blood. The way it is used changes its role in treatment.
            - paragraph [ref=e95]: At House of Rose, topical PRF is used with microneedling, while under-eye PRF and PRF Bio-Filler are injected by Diana Morrison, RN.
