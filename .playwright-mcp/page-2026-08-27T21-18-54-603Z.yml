        - generic [ref=f113e45]:
          - paragraph [ref=f113e46]: IV therapy at House of Rose
          - heading "More than a bag of fluids." [level=2] [ref=f113e47]
        - generic [ref=f113e48]:
          - paragraph [ref=f113e49]: An IV is a route of administration, not a promise. Fluid is delivered through a vein. What matters next is the current formulation, the person receiving it, and whether the appointment is appropriate.
          - paragraph [ref=f113e50]: House of Rose offers six named IV appointments. You do not need to interpret those names as a diagnosis or choose ingredients on your own. Diana Morrison, RN reviews relevant health information and the current option before an infusion proceeds.
          - paragraph [ref=f113e51]: It is one part of a broader practice conversation about aesthetics and wellness—not a substitute for medical care and not a universal answer.
