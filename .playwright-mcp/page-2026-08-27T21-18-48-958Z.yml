      - generic [ref=f112e122]:
        - generic [ref=f112e123]:
          - paragraph [ref=f112e124]: Facial result examples
          - heading "Subtle change deserves a full-size comparison." [level=2] [ref=f112e125]
          - paragraph [ref=f112e126]: Forma is often selected for gradual skin-quality and firmness goals. These manufacturer examples are shown large enough to compare the lower face and neck without presenting them as House of Rose outcomes.
        - figure "Manufacturer example. Not a House of Rose client. Forma example courtesy of Dr. H. Ohanian; attribution embedded in image" [ref=f112e128]:
          - img "Manufacturer-provided Forma facial before and after shown from the front" [ref=f112e129]
          - generic [ref=f112e130]:
            - strong [ref=f112e131]: Manufacturer example. Not a House of Rose client.
            - generic [ref=f112e132]: Forma example courtesy of Dr. H. Ohanian; attribution embedded in image
        - paragraph [ref=f112e133]: Individual results vary. Treatment plan, skin response, lighting, angle, and timing affect visible change.
      - generic [ref=f112e135]:
        - generic [ref=f112e136]:
          - paragraph [ref=f112e137]: How Forma fits over time
          - heading "Immediate warmth. Progressive skin-quality work." [level=2] [ref=f112e138]
          - paragraph [ref=f112e139]: Forma does not require downtime, but a no-downtime treatment can still be gradual. The number and spacing of sessions should come from the plan, not from a universal package formula.
        - list [ref=f112e140]:
          - listitem [ref=f112e141]:
            - generic [ref=f112e142]: "01"
            - generic [ref=f112e143]:
              - paragraph [ref=f112e144]: During treatment
              - heading "Controlled, monitored warmth" [level=3] [ref=f112e145]
              - paragraph [ref=f112e146]: The handpiece moves continuously while the system monitors surface temperature and adjusts RF delivery.
          - listitem [ref=f112e147]:
            - generic [ref=f112e148]: "02"
            - generic [ref=f112e149]:
              - paragraph [ref=f112e150]: Immediately after
              - heading "Return to the day" [level=3] [ref=f112e151]
              - paragraph [ref=f112e152]: Temporary warmth or mild pinkness may occur, but Forma does not require a recovery period.
          - listitem [ref=f112e153]:
            - generic [ref=f112e154]: "03"
            - generic [ref=f112e155]:
              - paragraph [ref=f112e156]: Over a planned series
              - heading "Assess smoothness and firmness" [level=3] [ref=f112e157]
              - paragraph [ref=f112e158]: Progress is evaluated across consistent photography and the concern that led to treatment.
          - listitem [ref=f112e159]:
            - generic [ref=f112e160]: "04"
            - generic [ref=f112e161]:
              - paragraph [ref=f112e162]: Maintenance
              - heading "Continue only when it still serves the goal" [level=3] [ref=f112e163]
              - paragraph [ref=f112e164]: Ongoing timing depends on response, preferences, and whether a more intensive modality would be more appropriate.
      - generic [ref=f112e166]:
        - generic [ref=f112e167]:
          - paragraph [ref=f112e168]: The treatment experience
          - heading "A warm facial treatment, without needles." [level=2] [ref=f112e169]
          - paragraph [ref=f112e170]: Forma’s appeal is not just convenience. It offers a controlled RF option for someone whose concern and tolerance do not call for fractional microneedling.
        - generic [ref=f112e171]:
          - article [ref=f112e172]:
            - heading "What does Forma feel like?" [level=3] [ref=f112e173]
            - paragraph [ref=f112e174]: Forma feels progressively warm as the handpiece moves across the skin. Temperature feedback helps keep the treatment within the selected range.
          - article [ref=f112e175]:
            - heading "Does Forma hurt?" [level=3] [ref=f112e176]
            - paragraph [ref=f112e177]: Forma is non-invasive and does not use needles. Heat tolerance varies, so tell the practitioner if an area feels too hot or uncomfortable.
          - article [ref=f112e178]:
            - heading "Is there downtime?" [level=3] [ref=f112e179]
            - paragraph [ref=f112e180]: No. Temporary warmth or mild pinkness can occur, but there is no recovery period required.
          - article [ref=f112e181]:
            - heading "How long does Forma take?" [level=3] [ref=f112e182]
            - paragraph [ref=f112e183]: Treatment time depends on the area selected and the plan. House of Rose confirms the appointment length when the facial or neck areas are chosen.
          - article [ref=f112e184]:
            - heading "How many sessions will I need?" [level=3] [ref=f112e185]
            - paragraph [ref=f112e186]: There is no one number for everyone. The starting concern, degree of laxity, response, and maintenance goal shape the recommendation.
          - article [ref=f112e187]:
            - heading "When will I see results?" [level=3] [ref=f112e188]
            - paragraph [ref=f112e189]: Some people notice a temporary smoother or firmer look after treatment, while collagen-related change is gradual. Individual response and timing vary.
      - generic [ref=f112e191]:
        - generic [ref=f112e192]:
          - paragraph [ref=f112e193]: Why Forma at House of Rose
          - heading "Convenience is useful only when the treatment matches the concern." [level=2] [ref=f112e194]
          - generic [ref=f112e195]:
            - paragraph [ref=f112e196]: A no-downtime option should not be sold as the answer to every degree of laxity. House of Rose begins with the amount and location of change you are noticing, then distinguishes a Forma maintenance plan from the more intensive fractional work Morpheus8 can provide.
            - paragraph [ref=f112e197]: The same consultation can identify when visible pigment or redness belongs with Lumecca Peak instead. The three technologies are complementary because they do different jobs—not because every client needs all three.
        - generic [ref=f112e198]:
          - paragraph [ref=f112e199]: What planning accounts for
          - list [ref=f112e200]:
            - listitem [ref=f112e201]: Concern matched to treatment intensity
            - listitem [ref=f112e202]: Face and neck areas planned deliberately
            - listitem [ref=f112e203]: Temperature-controlled delivery
            - listitem [ref=f112e204]: Clear escalation path to Morpheus8 when appropriate
          - paragraph [ref=f112e205]: "Treatments are provided under written physician protocol and medical direction.Medical Director: Joshua Shaw, MD · FL Lic. ME136232"
      - generic [ref=f112e207]:
        - heading "Forma and Forma Plus, without the confusion." [level=2] [ref=f112e208]
        - generic [ref=f112e209]:
          - article [ref=f112e210]:
            - paragraph [ref=f112e211]: Forma
            - heading "Smaller treatment areas" [level=3] [ref=f112e212]
            - text: Forma is the smaller applicator used for facial and other compact treatment areas. Here, the treatment areas are the face, jawline, and neck.
          - article [ref=f112e213]:
            - paragraph [ref=f112e214]: Forma Plus
            - heading "Larger treatment surface" [level=3] [ref=f112e215]
            - text: Forma Plus is the larger applicator available on the OptimasMAX platform. Its size changes the surface area it can cover; the treatment information here covers the face, jawline, and neck.
      - generic [ref=f112e217]:
        - generic [ref=f112e218]:
          - paragraph [ref=f112e219]: Combination treatment planning
          - heading "A second modality should have a separate job." [level=2] [ref=f112e220]
          - paragraph [ref=f112e221]: Combination planning is about matching each concern to the right technology and sequencing treatment responsibly. It is not an instruction to perform every modality in the same appointment.
        - generic [ref=f112e222]:
          - article [ref=f112e223]:
            - paragraph [ref=f112e224]: Remodel + maintain
            - heading "Morpheus8 + Forma" [level=3] [ref=f112e225]
            - generic [ref=f112e226]: A more intensive fractional RF plan can be followed, when appropriate, by non-invasive Forma sessions focused on ongoing skin quality and firmness.
