      - generic [ref=f112e97]:
        - generic [ref=f112e98]:
          - paragraph [ref=f112e99]: Forma vs. Morpheus8
          - heading "Same energy family. Different intensity and delivery." [level=2] [ref=f112e100]
          - paragraph [ref=f112e101]: Both use radiofrequency, but the resemblance ends there. Forma stays on the surface with smooth electrodes; Morpheus8 delivers fractional RF through microneedles at selected depths.
        - generic [ref=f112e102]:
          - article [ref=f112e103]:
