      - generic [ref=f112e52]:
        - generic [ref=f112e53]:
          - generic [ref=f112e54]:
            - paragraph [ref=f112e55]: What the treatment consists of · How Forma works
            - heading "The handpiece keeps moving. The temperature does not go unchecked." [level=2] [ref=f112e56]
          - generic [ref=f112e57]:
            - paragraph [ref=f112e58]: Forma’s smooth electrodes deliver bipolar radiofrequency through the skin surface as the handpiece moves across the planned area. The treatment is non-invasive and does not create microneedle channels.
            - paragraph [ref=f112e59]: Temperature is the point of control. Built-in thermistors continuously read the skin and automatically adjust RF delivery as the selected endpoint is approached. That feedback loop supports sustained, controlled heating instead of relying on a fixed burst without surface monitoring.
            - paragraph [ref=f112e60]: The result is a treatment designed for skin quality, smoothness, and mild firmness concerns without a visible recovery period. It is a distinct strategy, not a weaker version of Morpheus8.
          - generic [ref=f112e61]:
            - generic [ref=f112e62]:
              - term [ref=f112e63]: No needles
              - definition [ref=f112e64]: RF travels between electrodes at the skin surface.
            - generic [ref=f112e65]:
              - term [ref=f112e66]: Continuous feedback
              - definition [ref=f112e67]: Built-in temperature monitoring guides energy delivery while the handpiece moves.
            - generic [ref=f112e68]:
              - term [ref=f112e69]: Repeatable maintenance
              - definition [ref=f112e70]: The no-downtime format can fit an ongoing skin-quality plan when appropriate.
        - figure "InMode manufacturer media" [ref=f112e71]:
          - img "Forma and Forma Plus bipolar radiofrequency handpieces"
