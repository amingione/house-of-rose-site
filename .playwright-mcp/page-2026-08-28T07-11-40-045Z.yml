            - heading "What is House of Rose Aesthetics?" [level=3] [ref=e38]
            - paragraph [ref=e39]: House of Rose Aesthetics is a medical aesthetics practice in Punta Gorda, Florida.
          - generic [ref=e40]:
            - heading "Where is House of Rose located?" [level=3] [ref=e41]
            - paragraph [ref=e42]: "House of Rose has one practice location: 525 E Olympia Ave, Unit 9, Punta Gorda, FL 33950. Free parking is available outside the Unit 9 storefront."
          - generic [ref=e43]:
            - heading "How can I tell who provides a service?" [level=3] [ref=e44]
            - paragraph [ref=e45]: "Diana Morrison, RN provides Botox and Daxxify, dermal fillers, injectable PRF and PRF Bio-Filler, IV hydration, and GLP-1 weight management. Amber Mingione, Licensed Esthetician provides Procell Microneedling, topical PRF, Glo2Facial, dermaplaning, and BioRePeel as an add-on. Brandy, Licensed Esthetician provides facials, BioRePeel, and facial waxing. Aundrea Pedigo, Licensed Esthetician provides bridal, event, and everyday makeup; makeup artistry is a non-medical service. Medical Director: Joshua Shaw, MD · FL Lic. ME136232. Dr. Shaw provides medical direction and does not perform treatments at House of Rose."
          - generic [ref=e46]:
            - heading "What is the medical director’s role?" [level=3] [ref=e47]
            - paragraph [ref=e48]: Joshua Shaw, MD provides medical direction and protocol supervision. He does not perform treatments at House of Rose. The practitioner named for a treatment is the person who provides it.
      - generic [ref=e49]:
        - generic [ref=e50]:
          - generic [ref=e51]: Treatments
          - heading "Choosing where to begin" [level=2] [ref=e52]
        - generic [ref=e53]:
          - generic [ref=e54]:
            - heading "What services are offered?" [level=3] [ref=e55]
            - paragraph [ref=e56]: Services include skin treatments, injectables, body treatments, IV hydration, GLP-1 weight management, facial waxing, and professional home care.
          - generic [ref=e57]:
            - heading "How do I choose a service?" [level=3] [ref=e58]
            - paragraph [ref=e59]: Start with the change you notice rather than a product name. Describe the area, what looks or feels different, and how much recovery fits your schedule. House of Rose can help narrow the appropriate options.
          - generic [ref=e60]:
            - heading "What if I am comparing more than one treatment?" [level=3] [ref=e61]
            - paragraph [ref=e62]: Compare the material or device used, the concern each option addresses, who provides it, and the expected recovery. If the distinction is still unclear, contact House of Rose with the two treatment names and what you want to change.
          - generic [ref=e63]:
            - heading "What is the difference between skin analysis and a consultation?" [level=3] [ref=e64]
            - paragraph [ref=e65]: Skin analysis uses multi-spectrum photographs to make visible patterns easier to examine and create a visual baseline; it is not a medical diagnosis. A consultation is a conversation about a treatment, a concern, or a short list of options, including questions about the provider, price, timing, and recovery. Choose skin analysis when the photographs would help you see the skin more clearly. Choose a consultation when the main need is to talk through options.
            - generic [ref=e66]:
              - link "See skin analysis" [ref=e67] [cursor=pointer]:
                - /url: /skin-analysis/
              - link "See consultation" [ref=e68] [cursor=pointer]:
                - /url: /consultation/
          - generic [ref=e69]:
            - heading "How can I ask about current pricing?" [level=3] [ref=e70]
            - paragraph [ref=e71]: Call House of Rose at (941) 400-0165 or send a message with the treatment name for current pricing.
            - link "Contact House of Rose" [ref=e73] [cursor=pointer]:
              - /url: /contact/
          - generic [ref=e74]:
            - heading "What payment methods does House of Rose accept?" [level=3] [ref=e75]
            - paragraph [ref=e76]: House of Rose accepts American Express, Discover, Mastercard, Visa, debit cards, and checks.
          - generic [ref=e77]:
            - heading "Do you accept walk-ins?" [level=3] [ref=e78]
            - paragraph [ref=e79]: Yes. Walk-ins are always accepted for waxing and facials. For other services, walk-ins are accepted when the schedule allows. Appointments reserve a specific time; call (941) 400-0165 to check current availability.
