              - paragraph [ref=f123e53]: Skin analysis
              - heading "See more than ordinary light reveals" [level=3] [ref=f123e54]
              - paragraph [ref=f123e55]: Multi-spectrum imaging adds another view of visible pigment, texture, pores, and sun exposure. The photographs are reviewed with you as a baseline; they do not make a diagnosis.
            - generic [ref=f123e56]:
              - text: See how skin analysis works
