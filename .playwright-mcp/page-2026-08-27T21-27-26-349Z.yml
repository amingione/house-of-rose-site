          - generic [ref=f123e66]:
            - generic [ref=f123e67]: Beyond skin and injectables
            - heading "One address. Several very different reasons to visit." [level=2] [ref=f123e68]
          - generic [ref=f123e69]:
            - paragraph [ref=f123e70]: Skin care, an IV, a brow wax, and event makeup are four very different reasons to walk through the same door.
            - paragraph [ref=f123e71]: The right starting point depends on the concern, the treatment method, the practitioner, and how much recovery fits your schedule.
        - generic [ref=f123e72]:
          - article [ref=f123e73]:
            - generic [ref=f123e74]:
              - paragraph [ref=f123e75]: IV hydration
              - heading "Hydration and nutrient formulations with an RN" [level=3] [ref=f123e76]
              - paragraph [ref=f123e77]: Diana Morrison, RN provides IV hydration with formulations selected for the purpose of the visit and reviewed before administration.
            - link "Learn about IV hydration" [ref=f123e78] [cursor=pointer]:
              - /url: /services/iv-hydration-therapy/
          - article [ref=f123e79]:
            - generic [ref=f123e80]:
              - paragraph [ref=f123e81]: Weight management
              - heading "A conversation before a program" [level=3] [ref=f123e82]
              - paragraph [ref=f123e83]: Medical weight management is an ongoing program involving medical evaluation, medication when appropriate, and continued follow-up. Semaglutide and tirzepatide are two medications that may be considered.
            - link "Learn about weight management" [ref=f123e84] [cursor=pointer]:
              - /url: /services/glp-1-weight-management/
          - article [ref=f123e85]:
            - generic [ref=f123e86]:
              - paragraph [ref=f123e87]: Waxing
              - heading "Facial and body waxing by area" [level=3] [ref=f123e88]
              - paragraph [ref=f123e89]: Facial waxing covers the brows, upper lip, and chin. Body waxing is available for selected areas including the underarms, bikini line, chest, back, legs, and arms.
            - link "Explore waxing" [ref=f123e90] [cursor=pointer]:
              - /url: /services/waxing/
      - generic [ref=f123e92]:
