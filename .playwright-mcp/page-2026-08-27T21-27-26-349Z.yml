          - generic [ref=f123e33]: Skin, movement, and imaging
          - heading "What do you keep noticing?" [level=2] [ref=f123e34]
          - paragraph [ref=f123e35]: The useful detail may be roughness in certain light, a patch of uneven color, a line that appears when you smile, or a change in fullness. That detail helps narrow the services worth reading about.
        - generic [ref=f123e36]:
          - link [ref=f123e37] [cursor=pointer]:
            - /url: /services/collections/facials/
            - generic [ref=f123e38]:
              - paragraph [ref=f123e39]: Skin
              - heading "Is it roughness, visible pores, or uneven color?" [level=3] [ref=f123e40]
              - paragraph [ref=f123e41]: Maybe makeup catches on roughness, pores seem more visible, or a patch of uneven color keeps drawing your eye. Facials, peels, microneedling, and light-based treatments each work differently.
            - generic [ref=f123e42]:
              - text: Explore skin treatments
              - generic [ref=f123e43]: →
          - link [ref=f123e44] [cursor=pointer]:
            - /url: /services/injectables-bio-fillers/
            - generic [ref=f123e45]:
              - paragraph [ref=f123e46]: Injectables
              - heading "Notice what changes when your face moves" [level=3] [ref=f123e47]
              - paragraph [ref=f123e48]: A line that appears when you frown or squint is a different concern from lost fullness in the lips, cheeks, or folds. Botox and Daxxify address movement; hyaluronic-acid fillers add selected volume.
            - generic [ref=f123e49]:
              - text: Explore injectables
              - generic [ref=f123e50]: →
          - link [ref=f123e51] [cursor=pointer]:
