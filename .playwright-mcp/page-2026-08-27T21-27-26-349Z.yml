          - generic [ref=f123e128]: The detail matters
          - heading "Bring us the thing you keep seeing in the mirror." [level=2] [ref=f123e129]
          - generic [ref=f123e130]:
            - paragraph [ref=f123e131]: An under-eye shadow can come from pigment, thin skin, hollowing, or a combination. Facial lines may reflect movement, volume, texture, or all three. Two concerns that look similar in a photograph may point toward different services.
            - paragraph [ref=f123e132]: Point to it in the mirror, bring the photograph where it shows up, or simply describe when you notice it most. Those details give the conversation somewhere useful to begin.
