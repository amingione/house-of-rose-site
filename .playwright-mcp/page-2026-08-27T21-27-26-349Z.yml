        - generic [ref=f123e139]:
          - generic [ref=f123e140]: The people
          - heading "Who you trust with your face matters." [level=2] [ref=f123e141]
          - paragraph [ref=f123e142]: Know who provides each treatment. Diana Morrison, RN provides injectables, IV hydration, and GLP-1 weight management. Amber Mingione, Licensed Esthetician provides Microneedling with the Procell Therapies device, Glo2Facial, dermaplaning, and BioRePeel add-ons. Brandy, Licensed Esthetician, and Aundrea Pedigo, Licensed Esthetician, round out the team with facials, waxing, and makeup artistry.
          - generic [ref=f123e143]:
            - link [ref=f123e144] [cursor=pointer]:
              - /url: /about/providers/brandy/
