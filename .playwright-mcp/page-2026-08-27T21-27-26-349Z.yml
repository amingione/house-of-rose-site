          - generic [ref=f123e94]:
            - generic [ref=f123e95]: Platelet-rich fibrin
            - heading "PRF is used topically or by injection." [level=2] [ref=f123e96]
          - generic [ref=f123e97]:
            - paragraph [ref=f123e98]: PRF is a platelet concentrate prepared from a small sample of your own blood. The way it is used changes its role in treatment.
            - paragraph [ref=f123e99]: At House of Rose, topical PRF is used with microneedling, while under-eye PRF and PRF Bio-Filler are injected by Diana Morrison, RN.
        - generic [ref=f123e100]:
          - article [ref=f123e101]:
            - paragraph [ref=f123e102]: With microneedling
            - heading "Topical PRF with microneedling" [level=3] [ref=f123e103]
            - paragraph [ref=f123e104]: PRF is applied to the skin surface during an eligible microneedling service. It is not injected.
            - link "Microneedling with topical PRF" [ref=f123e105] [cursor=pointer]:
              - /url: /services/microneedling/
          - article [ref=f123e106]:
            - paragraph [ref=f123e107]: Under-eye use
            - heading "Injectable PRF" [level=3] [ref=f123e108]
            - paragraph [ref=f123e109]: Diana Morrison, RN provides injectable PRF for the under-eye area.
            - link "Read about PRF under eyes" [ref=f123e110] [cursor=pointer]:
              - /url: /services/prf-under-eyes/
          - article [ref=f123e111]:
            - paragraph [ref=f123e112]: Bio-Filler use
            - heading "PRF Bio-Filler" [level=3] [ref=f123e113]
            - paragraph [ref=f123e114]: Diana Morrison, RN provides PRF Bio-Filler as an injectable treatment.
            - link "Learn about injectable PRF" [ref=f123e115] [cursor=pointer]:
              - /url: /services/prf-injections/
        - generic [ref=f123e116]:
          - generic [ref=f123e117]:
            - heading "PRF and dermal filler use different materials." [level=3] [ref=f123e118]
            - paragraph [ref=f123e119]: PRF is an autologous platelet concentrate. Hyaluronic-acid dermal filler is a manufactured injectable gel. Their material, preparation, and purpose all differ.
