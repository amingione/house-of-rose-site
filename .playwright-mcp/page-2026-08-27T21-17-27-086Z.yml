      - generic [ref=f109e55]:
        - generic [ref=f109e56]:
          - generic [ref=f109e57]:
            - paragraph [ref=f109e58]: What the treatment consists of · What Morpheus8 actually does
            - heading "Mechanical depth and controlled heat, delivered together." [level=2] [ref=f109e59]
          - generic [ref=f109e60]:
            - paragraph [ref=f109e61]: The Morpheus8 handpiece places an array of microneedles into the planned area. Bipolar radiofrequency is then delivered through those electrodes at selected depths, creating small zones of controlled thermal treatment below the surface.
            - paragraph [ref=f109e62]: That combination matters. The microneedles establish where treatment occurs; radiofrequency adds a thermal remodeling component. Depth, energy, passes, and treatment area are not interchangeable settings, which is why anatomy and skin assessment shape the plan.
            - paragraph [ref=f109e63]: The response is progressive. Early swelling can temporarily change how the skin looks, but remodeling develops over the weeks and months that follow rather than appearing as one immediate final result.
          - generic [ref=f109e64]:
            - generic [ref=f109e65]:
              - term [ref=f109e66]: Fractional
              - definition [ref=f109e67]: Treatment is delivered in controlled zones with untreated tissue between them.
            - generic [ref=f109e68]:
              - term [ref=f109e69]: Selectable depth
              - definition [ref=f109e70]: The treatment plan can account for thinner, bony, and softer facial areas instead of using one depth everywhere.
            - generic [ref=f109e71]:
              - term [ref=f109e72]: Bipolar RF
              - definition [ref=f109e73]: Radiofrequency energy produces a controlled thermal effect at the selected treatment depth.
        - figure "InMode manufacturer media" [ref=f109e74]:
          - img "Morpheus8 Burst fractional radiofrequency microneedling handpiece" [ref=f109e76]
