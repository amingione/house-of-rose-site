      - generic [ref=f109e103]:
        - generic [ref=f109e104]:
          - paragraph [ref=f109e105]: Morpheus8 vs. traditional microneedling
          - heading "The needles are only half of the distinction." [level=2] [ref=f109e106]
          - paragraph [ref=f109e107]: Both create controlled micro-injury. Morpheus8 adds depth-selectable radiofrequency, so it belongs in a different treatment conversation than a more superficial microneedling plan.
        - generic [ref=f109e108]:
          - article [ref=f109e109]:
            - paragraph [ref=f109e110]: Mechanical micro-injury
            - heading "Traditional microneedling" [level=3] [ref=f109e111]
            - list [ref=f109e112]:
              - listitem [ref=f109e113]: — Primarily mechanical collagen induction
              - listitem [ref=f109e114]: — Typically a more superficial treatment strategy
              - listitem [ref=f109e115]: — No radiofrequency energy delivered through the needles
            - link "Explore Traditional microneedling" [ref=f109e116] [cursor=pointer]:
              - /url: /services/microneedling/
              - text: Explore Traditional microneedling
              - generic [ref=f109e117]: →
          - article [ref=f109e118]:
            - paragraph [ref=f109e119]: Fractional RF microneedling
            - heading "Morpheus8" [level=3] [ref=f109e120]
            - list [ref=f109e121]:
              - listitem [ref=f109e122]: — Microneedles plus bipolar radiofrequency
              - listitem [ref=f109e123]: — Selectable treatment depths
              - listitem [ref=f109e124]: — Thermal remodeling component
              - listitem [ref=f109e125]: — Settings tailored to anatomy and concern
      - generic [ref=f109e127]:
        - generic [ref=f109e128]:
          - paragraph [ref=f109e129]: Facial result example
          - heading "Look closely at the lower face, not just the lighting." [level=2] [ref=f109e130]
          - paragraph [ref=f109e131]: This manufacturer-provided four-treatment example is presented at a size that allows the lower-face texture and contour to be compared. It is not a prediction of an individual outcome.
        - figure "Four-treatment manufacturer example. Not a House of Rose client. Morpheus8 example courtesy of esmé, the medspa; attribution embedded in image" [ref=f109e133]:
          - img "Manufacturer-provided Morpheus8 facial before and after showing the lower face after four treatments" [ref=f109e134]
          - generic [ref=f109e135]:
            - strong [ref=f109e136]: Four-treatment manufacturer example. Not a House of Rose client.
            - generic [ref=f109e137]: Morpheus8 example courtesy of esmé, the medspa; attribution embedded in image
        - paragraph [ref=f109e138]: Individual results vary. Treatment count, settings, skin response, lighting, angle, and timing affect visible change.
      - generic [ref=f109e140]:
        - generic [ref=f109e141]:
          - paragraph [ref=f109e142]: Results and recovery timeline
          - heading "A treatment day, a recovery window, then gradual change." [level=2] [ref=f109e143]
          - paragraph [ref=f109e144]: Published RF microneedling literature reports that pain, redness, bruising, and swelling commonly settle over roughly two to five days, but depth and energy change the experience. Your House of Rose instructions take priority for your treatment.
        - list [ref=f109e145]:
          - listitem [ref=f109e146]:
            - generic [ref=f109e147]: "01"
            - generic [ref=f109e148]:
              - paragraph [ref=f109e149]: Treatment day
              - heading "Controlled treatment + immediate response" [level=3] [ref=f109e150]
              - paragraph [ref=f109e151]: Redness, warmth, pinpoint bleeding, tenderness, and swelling can occur. The treated area may look more affected before it looks improved.
          - listitem [ref=f109e152]:
            - generic [ref=f109e153]: "02"
            - generic [ref=f109e154]:
              - paragraph [ref=f109e155]: Days 1–5
              - heading "Visible recovery" [level=3] [ref=f109e156]
              - paragraph [ref=f109e157]: Redness and swelling typically recede during this period. Makeup and active skincare timing depend on closure of the microchannels and the instructions provided after treatment.
          - listitem [ref=f109e158]:
            - generic [ref=f109e159]: "03"
            - generic [ref=f109e160]:
              - paragraph [ref=f109e161]: Following weeks
              - heading "Early texture changes" [level=3] [ref=f109e162]
              - paragraph [ref=f109e163]: As the immediate response settles, early changes can become easier to assess. This is not the final remodeling point.
          - listitem [ref=f109e164]:
            - generic [ref=f109e165]: "04"
            - generic [ref=f109e166]:
              - paragraph [ref=f109e167]: Following months
              - heading "Progressive remodeling" [level=3] [ref=f109e168]
              - paragraph [ref=f109e169]: Collagen-related change develops gradually. Follow-up is used to compare the response with baseline and decide whether another session belongs in the plan.
          - listitem [ref=f109e170]:
            - generic [ref=f109e171]: "05"
            - generic [ref=f109e172]:
              - paragraph [ref=f109e173]: Maintenance
              - heading "Only when the result and goal support it" [level=3] [ref=f109e174]
              - paragraph [ref=f109e175]: Maintenance is not one universal calendar. Timing depends on the original concern, treatment response, and the pace of future change.
      - generic [ref=f109e177]:
        - generic [ref=f109e178]:
          - paragraph [ref=f109e179]: The treatment experience
          - heading "The questions worth answering before treatment day." [level=2] [ref=f109e180]
          - paragraph [ref=f109e181]: Appointment length, anesthetic approach, and recovery instructions depend on the area and treatment settings. House of Rose confirms those details as part of the plan rather than posting one protocol for every face.
        - generic [ref=f109e182]:
          - article [ref=f109e183]:
            - heading "How long does it take?" [level=3] [ref=f109e184]
            - paragraph [ref=f109e185]: The treatment area, planned settings, and time allowed for comfort measures determine appointment length. Your consultation confirms the time reserved for your plan.
          - article [ref=f109e186]:
            - heading "What does it feel like?" [level=3] [ref=f109e187]
            - paragraph [ref=f109e188]: RF microneedling can feel sharp, hot, and pressure-like. The sensation varies by anatomy, depth, energy, and individual tolerance.
          - article [ref=f109e189]:
            - heading "Is numbing used?" [level=3] [ref=f109e190]
            - paragraph [ref=f109e191]: Topical anesthetic is commonly used in RF microneedling. The exact comfort plan is confirmed for the selected settings and your health history.
          - article [ref=f109e192]:
            - heading "What will I look like afterward?" [level=3] [ref=f109e193]
            - paragraph [ref=f109e194]: Expect visible redness and some swelling. Pinpoint marks, dryness, roughness, or light crusting can occur as the microchannels close.
          - article [ref=f109e195]:
            - heading "When can I wear makeup or restart skincare?" [level=3] [ref=f109e196]
            - paragraph [ref=f109e197]: Published guidance ties makeup and topical-product return to closure of the microchannels, often within one to three days. Follow the specific instructions House of Rose gives you; do not restart active products on your own timeline.
          - article [ref=f109e198]:
            - heading "How many sessions might I need?" [level=3] [ref=f109e199]
            - paragraph [ref=f109e200]: House of Rose has single-session and series options, but the recommendation depends on the concern, area, settings, and response. A series is not automatic for every client.
      - generic [ref=f109e202]:
        - generic [ref=f109e203]:
          - paragraph [ref=f109e204]: Why Morpheus8 at House of Rose
          - heading "The device is standardized. The plan should not be." [level=2] [ref=f109e205]
          - generic [ref=f109e206]:
            - paragraph [ref=f109e207]: Morpheus8 is an operator-dependent medical procedure. The useful distinction is not simply owning the platform; it is assessing anatomy, choosing an appropriate depth and energy strategy, documenting baseline skin, and planning recovery before the first pulse.
            - paragraph [ref=f109e208]: House of Rose uses consultation to decide whether Morpheus8 is appropriate, whether a less intensive option makes more sense, and whether pigment or redness calls for a different modality. The goal is measured, natural-looking improvement without treating every concern as a reason to increase intensity.
        - generic [ref=f109e209]:
          - paragraph [ref=f109e210]: What planning accounts for
          - list [ref=f109e211]:
            - listitem [ref=f109e212]: Anatomy-led treatment mapping
            - listitem [ref=f109e213]: Skin and health-history review
            - listitem [ref=f109e214]: Depth and settings selected for the area
            - listitem [ref=f109e215]: Combination modalities only when they answer a separate concern
          - paragraph [ref=f109e216]: "Treatments are provided under written physician protocol and medical direction.Medical Director: Joshua Shaw, MD · FL Lic. ME136232"
      - generic [ref=f109e218]:
        - generic [ref=f109e219]:
          - paragraph [ref=f109e220]: Combination treatment planning
          - heading "A second modality should have a separate job." [level=2] [ref=f109e221]
          - paragraph [ref=f109e222]: Combination planning is about matching each concern to the right technology and sequencing treatment responsibly. It is not an instruction to perform every modality in the same appointment.
        - generic [ref=f109e223]:
          - article [ref=f109e224]:
            - paragraph [ref=f109e225]: Structure + complexion
            - heading "Morpheus8 + Lumecca Peak" [level=3] [ref=f109e226]
            - generic [ref=f109e227]: Morpheus8 addresses fractional remodeling and texture. Lumecca Peak addresses visible pigment, photodamage, and vascular discoloration. The value is in assigning each concern to the technology built for it.
