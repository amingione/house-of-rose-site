      - heading "Calm, personal, and thoughtfully paced." [level=2] [ref=e124]
      - paragraph [ref=e125]: Appointments at House of Rose are designed to feel calm, focused, and entirely personalized. We take the time to understand your goals, evaluate your skin with precision, and recommend treatments that are aligned—not excessive, not rushed, and never driven by trends.
      - paragraph [ref=e126]: You'll leave with clarity—what was done, why it matters, and exactly how to maintain your results.
