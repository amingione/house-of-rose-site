        - generic [ref=e41]: About House of Rose
        - heading "A more considered approach to aesthetics." [level=2] [ref=e42]
        - paragraph [ref=e43]: House of Rose Aesthetics was created for clients who expect more than a standard appointment or transactional treatment menu.
        - paragraph [ref=e44]: Our approach is intentional, results-focused, and built around long-term skin health. Every recommendation is made with precision—balancing advanced aesthetic treatments, regenerative techniques, and personalized care to deliver outcomes that feel refined, natural, and aligned with you.
        - paragraph [ref=e45]: Rather than focusing on isolated services, we design cohesive treatment plans that evolve with your skin, your goals, and the results you want to maintain over time.
      - img "The House of Rose Aesthetics lounge in Punta Gorda, Florida" [ref=e47]
    - generic [ref=e50]:
      - generic [ref=e51]: Our Approach
      - heading "Where regenerative aesthetics meets precision care." [level=2] [ref=e52]
      - paragraph [ref=e53]: Our approach is centered on supporting the skin intelligently—from regeneration and correction to maintenance and long-term results.
      - paragraph [ref=e54]: "Signature treatments such as PRF are part of a broader philosophy: enhancing skin function, restoring balance, and creating visible improvements without overcorrection. Every treatment is selected with purpose, layered strategically, and tailored to how your skin responds over time."
      - paragraph [ref=e55]: This is not trend-driven aesthetics. This is structured, outcome-focused care designed to deliver results that feel effortless—and last.
