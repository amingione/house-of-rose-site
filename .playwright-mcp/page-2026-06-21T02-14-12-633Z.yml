    - generic [ref=e100]:
      - generic [ref=e101]:
        - generic [ref=e102]: Memberships & Ongoing Care
        - heading "Care that continues beyond a single appointment." [level=2] [ref=e103]
        - paragraph [ref=e104]: Results are built over time—and maintained with intention. Our membership options are designed for clients who want consistent care, structured treatment plans, and ongoing access to professional guidance.
        - paragraph [ref=e105]: Rather than booking sporadically, members benefit from a more connected approach that supports long-term results and simplifies decision-making. With preferred access, curated treatment pathways, and ongoing support, memberships are the most effective way to stay aligned with your skin goals year-round.
        - link "Explore Memberships" [ref=e107] [cursor=pointer]:
          - /url: /memberships
