        - generic [ref=e114]: Curated Home Care
        - heading "Professional skincare, selected with purpose." [level=2] [ref=e115]
        - paragraph [ref=e116]: Every product we carry is selected to support treatment outcomes and simplify your routine at home. From post-treatment aftercare to acne support, mineral makeup, SPF, and corrective skincare, our selection is built to work with your plan, not compete with it.
        - paragraph [ref=e117]: Rather than overwhelming you with options, we provide curated recommendations tailored to your skin, your treatments, and your long-term goals—so everything you use works together with intention.
