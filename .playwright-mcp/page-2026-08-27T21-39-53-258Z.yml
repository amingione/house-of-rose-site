      - generic [ref=f125e137]:
        - generic [ref=f125e138]:
          - generic [ref=f125e139]: The people
          - heading "Who you trust with your face matters." [level=2] [ref=f125e140]
          - paragraph [ref=f125e141]: Know who provides each treatment. Diana Morrison, RN provides injectables, IV hydration, and GLP-1 weight management. Amber Mingione, Licensed Esthetician provides Microneedling with the Procell Therapies device, Glo2Facial, dermaplaning, and BioRePeel add-ons. Brandy, Licensed Esthetician, and Aundrea Pedigo, Licensed Esthetician, round out the team with facials, waxing, and makeup artistry.
          - generic [ref=f125e142]:
            - link [ref=f125e143] [cursor=pointer]:
              - /url: /about/providers/brandy/
              - generic [ref=f125e144]:
                - strong [ref=f125e145]: Brandy, Licensed Esthetician
                - text: Facials · BioRePeel · Facial waxing
              - generic [ref=f125e146]: →
            - link [ref=f125e147] [cursor=pointer]:
              - /url: /about/providers/aundrea/
              - generic [ref=f125e148]:
                - strong [ref=f125e149]: Aundrea Pedigo, Licensed Esthetician
                - text: Bridal · Event · Everyday makeup
              - generic [ref=f125e150]: →
          - paragraph [ref=f125e151]: Medical direction and treatment delivery are different roles. Joshua Shaw, MD provides medical direction and protocol supervision; he does not perform treatments at House of Rose. Diana Morrison, RN and the licensed estheticians named above provide the treatments within their roles.
          - paragraph [ref=f125e152]: "Medical Director: Joshua Shaw, MD · FL Lic. ME136232"
