      - generic [ref=f125e63]:
        - generic [ref=f125e64]:
          - generic [ref=f125e65]:
            - generic [ref=f125e66]: Beyond skin and injectables
            - heading "One address. Several very different reasons to visit." [level=2] [ref=f125e67]
          - generic [ref=f125e68]:
            - paragraph [ref=f125e69]: Skin care, an IV, a brow wax, and event makeup are four very different reasons to walk through the same door.
            - paragraph [ref=f125e70]: The right starting point depends on the concern, the treatment method, the practitioner, and how much recovery fits your schedule.
        - generic [ref=f125e71]:
          - article [ref=f125e72]:
            - generic [ref=f125e73]:
              - paragraph [ref=f125e74]: IV hydration
              - heading "Hydration and nutrient formulations with an RN" [level=3] [ref=f125e75]
              - paragraph [ref=f125e76]: Diana Morrison, RN provides IV hydration with formulations selected for the purpose of the visit and reviewed before administration.
            - link "Learn about IV hydration" [ref=f125e77] [cursor=pointer]:
              - /url: /services/iv-hydration-therapy/
          - article [ref=f125e78]:
            - generic [ref=f125e79]:
              - paragraph [ref=f125e80]: Weight management
              - heading "A conversation before a program" [level=3] [ref=f125e81]
              - paragraph [ref=f125e82]: Medical weight management is an ongoing program involving medical evaluation, medication when appropriate, and continued follow-up. Semaglutide and tirzepatide are two medications that may be considered.
            - link "Learn about weight management" [ref=f125e83] [cursor=pointer]:
              - /url: /services/glp-1-weight-management/
          - article [ref=f125e84]:
            - generic [ref=f125e85]:
              - paragraph [ref=f125e86]: Waxing
              - heading "Facial and body waxing by area" [level=3] [ref=f125e87]
              - paragraph [ref=f125e88]: Facial waxing covers the brows, upper lip, and chin. Body waxing is available for selected areas including the underarms, bikini line, chest, back, legs, and arms.
            - link "Explore waxing" [ref=f125e89] [cursor=pointer]:
              - /url: /services/waxing/
      - generic [ref=f125e91]:
        - generic [ref=f125e92]:
          - generic [ref=f125e93]:
            - generic [ref=f125e94]: Platelet-rich fibrin
            - heading "PRF is used topically or by injection." [level=2] [ref=f125e95]
          - generic [ref=f125e96]:
            - paragraph [ref=f125e97]: PRF is a platelet concentrate prepared from a small sample of your own blood. The way it is used changes its role in treatment.
            - paragraph [ref=f125e98]: At House of Rose, topical PRF is used with microneedling, while under-eye PRF and PRF Bio-Filler are injected by Diana Morrison, RN.
        - generic [ref=f125e99]:
          - article [ref=f125e100]:
            - paragraph [ref=f125e101]: With microneedling
            - heading "Topical PRF with microneedling" [level=3] [ref=f125e102]
            - paragraph [ref=f125e103]: PRF is applied to the skin surface during an eligible microneedling service. It is not injected.
            - link "Microneedling with topical PRF" [ref=f125e104] [cursor=pointer]:
              - /url: /services/microneedling/
          - article [ref=f125e105]:
            - paragraph [ref=f125e106]: Under-eye use
            - heading "Injectable PRF" [level=3] [ref=f125e107]
            - paragraph [ref=f125e108]: Diana Morrison, RN provides injectable PRF for the under-eye area.
            - link "Read about PRF under eyes" [ref=f125e109] [cursor=pointer]:
              - /url: /services/prf-under-eyes/
          - article [ref=f125e110]:
            - paragraph [ref=f125e111]: Bio-Filler use
            - heading "PRF Bio-Filler" [level=3] [ref=f125e112]
            - paragraph [ref=f125e113]: Diana Morrison, RN provides PRF Bio-Filler as an injectable treatment.
            - link "Learn about injectable PRF" [ref=f125e114] [cursor=pointer]:
              - /url: /services/prf-injections/
        - generic [ref=f125e115]:
          - generic [ref=f125e116]:
            - heading "PRF and dermal filler use different materials." [level=3] [ref=f125e117]
            - paragraph [ref=f125e118]: PRF is an autologous platelet concentrate. Hyaluronic-acid dermal filler is a manufactured injectable gel. Their material, preparation, and purpose all differ.
          - generic [ref=f125e119]:
            - link "Explore PRF" [ref=f125e120] [cursor=pointer]:
              - /url: /services/prf/
            - link "Dermal Fillers" [ref=f125e121] [cursor=pointer]:
              - /url: /services/dermal-fillers/
