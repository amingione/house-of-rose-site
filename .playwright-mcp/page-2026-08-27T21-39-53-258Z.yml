        - generic [ref=f125e31]:
          - generic [ref=f125e32]: Skin, movement, and imaging
          - heading "What do you keep noticing?" [level=2] [ref=f125e33]
          - paragraph [ref=f125e34]: The useful detail may be roughness in certain light, a patch of uneven color, a line that appears when you smile, or a change in fullness. That detail helps narrow the services worth reading about.
        - generic [ref=f125e35]:
          - link [ref=f125e36] [cursor=pointer]:
            - /url: /services/collections/facials/
            - generic [ref=f125e37]:
              - paragraph [ref=f125e38]: Skin
              - heading "Is it roughness, visible pores, or uneven color?" [level=3] [ref=f125e39]
              - paragraph [ref=f125e40]: Maybe makeup catches on roughness, pores seem more visible, or a patch of uneven color keeps drawing your eye. Facials, peels, microneedling, and light-based treatments each work differently.
            - generic [ref=f125e41]:
              - text: Explore skin treatments
              - generic [ref=f125e42]: →
          - link [ref=f125e43] [cursor=pointer]:
            - /url: /services/injectables-bio-fillers/
            - generic [ref=f125e44]:
              - paragraph [ref=f125e45]: Injectables
              - heading "Notice what changes when your face moves" [level=3] [ref=f125e46]
              - paragraph [ref=f125e47]: A line that appears when you frown or squint is a different concern from lost fullness in the lips, cheeks, or folds. Botox and Daxxify address movement; hyaluronic-acid fillers add selected volume.
            - generic [ref=f125e48]:
              - text: Explore injectables
              - generic [ref=f125e49]: →
          - link [ref=f125e50] [cursor=pointer]:
            - /url: /skin-analysis/
            - generic [ref=f125e51]:
              - paragraph [ref=f125e52]: Skin analysis
              - heading "See more than ordinary light reveals" [level=3] [ref=f125e53]
              - paragraph [ref=f125e54]: Multi-spectrum imaging adds another view of visible pigment, texture, pores, and sun exposure. The photographs are reviewed with you as a baseline; they do not make a diagnosis.
            - generic [ref=f125e55]:
              - text: See how skin analysis works
              - generic [ref=f125e56]: →
