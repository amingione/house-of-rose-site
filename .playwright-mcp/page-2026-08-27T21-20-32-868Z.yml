        - generic [ref=f117e63]:
          - generic [ref=f117e64]: What the treatment consists of
          - heading "What happens during Microneedling." [level=3] [ref=f117e65]
          - generic [ref=f117e66]:
            - article [ref=f117e67]:
              - text: "01"
              - heading "Prepare the skin" [level=4] [ref=f117e68]
              - paragraph [ref=f117e69]: The treatment area is cleansed, assessed, and prepared before channeling begins.
            - article [ref=f117e70]:
              - text: "02"
              - heading "Create controlled microchannels" [level=4] [ref=f117e71]
              - paragraph [ref=f117e72]: The Procell device moves across the planned area at settings selected for the skin and goal.
            - article [ref=f117e73]:
              - text: "03"
              - heading "Apply the selected topical" [level=4] [ref=f117e74]
              - paragraph [ref=f117e75]: The service uses the selected Procell Pro, Procell MD, or topical PRF pathway, followed by written aftercare.
        - generic [ref=f117e76]:
          - generic [ref=f117e77]: Treatment details
          - generic [ref=f117e78]:
            - article [ref=f117e79]:
              - heading "Procell Pro" [level=3] [ref=f117e80]
              - paragraph [ref=f117e81]: Procell Pro and Procell MD use the same Procell Therapies device. Pro refers to the Pro Microchannel Serum used with the service.
            - article [ref=f117e82]:
              - heading "Procell MD" [level=3] [ref=f117e83]
              - paragraph [ref=f117e84]: The MD Microchannel Serum shares the Pro serum’s core formulation and contains twice the concentration of growth factors. The difference is the topical serum, not a different needling device.
        - generic [ref=f117e85]:
          - generic [ref=f117e86]:
            - generic [ref=f117e87]: How many treatments?
            - heading "Treatment frequency." [level=3] [ref=f117e88]
          - paragraph [ref=f117e89]: Treatment count depends on the concern, selected depth, skin response, and whether the Procell Pro, Procell MD, or topical PRF option is used.
        - generic [ref=f117e90]:
          - generic [ref=f117e91]: Related treatments
          - heading "When another approach addresses a different concern." [level=3] [ref=f117e92]
          - article [ref=f117e94]:
            - heading "Topical PRF Microneedling" [level=4] [ref=f117e95]
            - paragraph [ref=f117e96]: Topical PRF is a current Microneedling option. A small blood sample is processed, and the PRF is applied topically rather than injected.
            - link "Read about Topical PRF Microneedling" [ref=f117e97] [cursor=pointer]:
              - /url: /services/prf/
        - generic [ref=f117e98]:
