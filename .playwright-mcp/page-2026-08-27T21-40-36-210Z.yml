  - main [ref=f126e12]:
    - generic [ref=f126e16]:
      - generic [ref=f126e17]: Skin Imaging · Punta Gorda
      - heading "See more than the mirror shows." [level=1] [ref=f126e18]
      - paragraph [ref=f126e20]: Multi-spectrum photographs make pigmentation, texture, pores, fine lines, and visible sun exposure easier to examine before you choose a skin service.
      - generic [ref=f126e21]:
        - link "Ask about Skin Analysis" [ref=f126e22] [cursor=pointer]:
          - /url: "#consultation"
        - link "View Services" [ref=f126e23] [cursor=pointer]:
          - /url: /services/
    - generic [ref=f126e24]:
      - generic [ref=f126e25]:
        - generic [ref=f126e26]: The analysis
        - heading "Three views of the skin." [level=2] [ref=f126e27]
        - paragraph [ref=f126e28]: Skin Analysis captures standard, cross-polarized, and UV photographs. Taking the images takes a few minutes; the rest of the time is used to review what appears in them.
        - paragraph [ref=f126e29]: Skin imaging is optional—not required before another service. The photographs provide a consistent visual baseline, not a medical diagnosis.
      - img "A treatment suite inside House of Rose Aesthetics in Punta Gorda" [ref=f126e31]
    - generic [ref=f126e33]:
      - generic [ref=f126e34]:
        - generic [ref=f126e35]: Reading the images
        - heading "What each image adds—and what it cannot decide." [level=2] [ref=f126e36]
        - paragraph [ref=f126e37]: Each light mode records the skin differently. We compare the views with one another because no single photograph explains the cause of a visible pattern.
      - generic [ref=f126e38]:
        - article [ref=f126e39]:
          - heading "Standard light" [level=3] [ref=f126e40]
          - paragraph [ref=f126e41]: Records the visible surface, including texture, pores, fine lines, and spots that can be seen in ordinary light.
        - article [ref=f126e42]:
          - heading "Cross-polarized light" [level=3] [ref=f126e43]
          - paragraph [ref=f126e44]: Reduces surface reflection so pigment and redness patterns are easier to examine alongside the standard photograph.
        - article [ref=f126e45]:
          - heading "UV light" [level=3] [ref=f126e46]
          - paragraph [ref=f126e47]: Adds a fluorescence-based view. Concentrated pigment may appear darker, and fluorescence associated with some porphyrins may be visible.
      - complementary "Skin imaging limitations" [ref=f126e48]:
        - heading "A photograph is not a diagnosis." [level=3] [ref=f126e49]
        - paragraph [ref=f126e50]: These views document patterns. They do not determine their medical cause, diagnose a skin condition, or screen for skin cancer.
        - paragraph [ref=f126e51]: Hair, facial expression, makeup, sunscreen residue, and other material on the skin can affect an image. A changing spot, unexplained symptom, or other medical skin concern needs evaluation by an appropriately licensed medical provider.
    - generic [ref=f126e53]:
      - generic [ref=f126e54]:
        - generic [ref=f126e55]: During the analysis
        - heading "What happens while we take and review the images." [level=2] [ref=f126e56]
      - generic [ref=f126e57]:
        - generic [ref=f126e58]:
          - text: "01"
          - heading "Take the photographs" [level=3] [ref=f126e59]
          - paragraph [ref=f126e60]: We photograph your skin in consistent, controlled lighting. Taking the images takes a few minutes.
        - generic [ref=f126e61]:
          - text: "02"
          - heading "Review them together" [level=3] [ref=f126e62]
          - paragraph [ref=f126e63]: We compare the photographs with you, point out what appears in each view, and answer your questions.
    - generic [ref=f126e65]:
