    - generic [ref=f126e77]:
      - generic [ref=f126e78]: Questions
      - heading "What to know." [level=2] [ref=f126e79]
      - generic [ref=f126e80]:
        - generic [ref=f126e81]:
          - heading "How can I ask about skin analysis pricing?" [level=3] [ref=f126e82]
          - paragraph [ref=f126e83]: Call House of Rose or send a message with “Skin Analysis” as the topic for current pricing.
        - generic [ref=f126e84]:
          - heading "Do I need a skin analysis before treatment?" [level=3] [ref=f126e85]
          - paragraph [ref=f126e86]: No. It is not required before every treatment. The analysis can be helpful when you are unsure where to begin or want a clearer visual baseline.
        - generic [ref=f126e87]:
          - heading "How long does it take?" [level=3] [ref=f126e88]
          - paragraph [ref=f126e89]: Taking the images takes a few minutes. The rest of the visit is used to review what appears in them and answer your questions.
        - generic [ref=f126e90]:
          - heading "Is skin imaging uncomfortable?" [level=3] [ref=f126e91]
          - paragraph [ref=f126e92]: No. It is non-invasive and does not use needles. We take the images and review them with you.
        - generic [ref=f126e93]:
          - heading "Can skin imaging diagnose a skin condition or screen for skin cancer?" [level=3] [ref=f126e94]
          - paragraph [ref=f126e95]: No. The images document visible patterns but do not determine their medical cause, diagnose a condition, or screen for skin cancer. A changing spot, unexplained symptom, or other medical skin concern needs evaluation by an appropriately licensed medical provider.
        - generic [ref=f126e96]:
          - heading "Can makeup or sunscreen affect the images?" [level=3] [ref=f126e97]
          - paragraph [ref=f126e98]: Yes. Makeup, sunscreen residue, and other material on the skin can affect what appears in a UV image. We review the photographs together rather than treating any one image as a diagnosis.
        - generic [ref=f126e99]:
          - heading "What happens to my photos?" [level=3] [ref=f126e100]
          - paragraph [ref=f126e101]: Your images remain private unless you give separate written permission for them to be shared.
    - generic [ref=f126e103]:
