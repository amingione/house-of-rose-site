        - generic [ref=f111e97]:
          - paragraph [ref=f111e98]: Complexion result example
          - heading "Pigment is easier to evaluate at full scale." [level=2] [ref=f111e99]
          - paragraph [ref=f111e100]: This manufacturer example shows visible facial discoloration before and after Lumecca. It is not a House of Rose client or a guarantee of the response your skin will have.
        - figure "Manufacturer example. Not a House of Rose client. Lumecca example courtesy of K. Spector, LME; attribution embedded in image" [ref=f111e102]:
          - img "Manufacturer-provided Lumecca Peak facial before and after showing visible brown pigmentation" [ref=f111e103]
          - generic [ref=f111e104]:
            - strong [ref=f111e105]: Manufacturer example. Not a House of Rose client.
            - generic [ref=f111e106]: Lumecca example courtesy of K. Spector, LME; attribution embedded in image
        - paragraph [ref=f111e107]: Individual results vary. Pigment type, vascular pattern, skin tone, sun history, settings, and treatment count affect visible change.
      - generic [ref=f111e109]:
        - generic [ref=f111e110]:
          - paragraph [ref=f111e111]: What happens after IPL
          - heading "Pigment may look darker before it looks clearer." [level=2] [ref=f111e112]
          - paragraph [ref=f111e113]: The sequence below reflects InMode patient guidance for Lumecca IPL. Your response can differ, and the instructions given after your House of Rose visit take priority.
        - list [ref=f111e114]:
          - listitem [ref=f111e115]:
            - generic [ref=f111e116]: "01"
            - generic [ref=f111e117]:
              - paragraph [ref=f111e118]: Immediately
              - heading "Warmth and temporary redness" [level=3] [ref=f111e119]
              - paragraph [ref=f111e120]: A warm feeling and redness can occur after the light pulses. The sapphire tip is part of the treatment’s cooling system.
          - listitem [ref=f111e121]:
            - generic [ref=f111e122]: "02"
            - generic [ref=f111e123]:
              - paragraph [ref=f111e124]: 24–48 hours
              - heading "Brown spots may darken" [level=3] [ref=f111e125]
              - paragraph [ref=f111e126]: Targeted pigment can become more visible before it begins to shed. Do not scrub or pick at it.
          - listitem [ref=f111e127]:
            - generic [ref=f111e128]: "03"
            - generic [ref=f111e129]:
              - paragraph [ref=f111e130]: Following week
              - heading "Pigment begins to flake or fade" [level=3] [ref=f111e131]
              - paragraph [ref=f111e132]: Darkened spots can move toward the surface and shed as the complexion starts to look more even.
          - listitem [ref=f111e133]:
            - generic [ref=f111e134]: "04"
            - generic [ref=f111e135]:
              - paragraph [ref=f111e136]: Around 1–2 weeks
              - heading "The visible result is easier to assess" [level=3] [ref=f111e137]
              - paragraph [ref=f111e138]: Manufacturer guidance describes the most visible complexion change in this window after a session, while treatment response and the need for another visit vary.
      - generic [ref=f111e140]:
        - generic [ref=f111e141]:
          - paragraph [ref=f111e142]: The treatment experience
          - heading "Fast pulses, bright flashes, and a sun-aware plan." [level=2] [ref=f111e143]
          - paragraph [ref=f111e144]: IPL planning begins before treatment day. Recent tanning or heavy sun exposure can change candidacy and raise the risk of an unwanted pigment response.
        - generic [ref=f111e145]:
          - article [ref=f111e146]:
            - heading "What does Lumecca Peak feel like?" [level=3] [ref=f111e147]
            - paragraph [ref=f111e148]: Each pulse creates a bright flash and a brief snapping or warm sensation. Sensation varies by area and settings.
          - article [ref=f111e149]:
            - heading "What will I look like afterward?" [level=3] [ref=f111e150]
            - paragraph [ref=f111e151]: Temporary redness and warmth can occur. Brown spots may darken over the next one to two days before they begin to flake or fade.
          - article [ref=f111e152]:
            - heading "Is there downtime?" [level=3] [ref=f111e153]
            - paragraph [ref=f111e154]: Many people return to ordinary activities, but visible redness or darkened pigment may be noticeable. Recovery appearance depends on the targets treated and your response.
          - article [ref=f111e155]:
            - heading "Why does sun exposure matter?" [level=3] [ref=f111e156]
            - paragraph [ref=f111e157]: IPL energy is absorbed by pigment. Recent tanning or excessive sun exposure changes the amount and distribution of pigment in the skin, which can change treatment safety and settings.
          - article [ref=f111e158]:
            - heading "How many sessions are needed?" [level=3] [ref=f111e159]
            - paragraph [ref=f111e160]: House of Rose has single-session and series options. Pigment type, vascular pattern, skin response, and the area determine whether more than one treatment makes sense.
          - article [ref=f111e161]:
            - heading "Can I wear makeup afterward?" [level=3] [ref=f111e162]
            - paragraph [ref=f111e163]: Makeup timing depends on the skin response and instructions provided after treatment. Apply nothing over irritated or disrupted skin unless House of Rose has cleared it.
      - generic [ref=f111e165]:
        - generic [ref=f111e166]:
          - paragraph [ref=f111e167]: Why consultation matters
          - heading "Not every brown spot is the same target." [level=2] [ref=f111e168]
          - generic [ref=f111e169]:
            - paragraph [ref=f111e170]: Visible pigment can come from different sources, depths, and histories. Redness can also have more than one cause. IPL should begin with a skin and sun-exposure review, not a promise that every mark will respond the same way.
            - paragraph [ref=f111e171]: House of Rose uses the consultation to decide whether the concern is appropriate for Lumecca Peak, how to plan around sun exposure, and whether a texture or firmness concern belongs with Morpheus8 or Forma instead.
        - generic [ref=f111e172]:
          - paragraph [ref=f111e173]: What planning accounts for
          - list [ref=f111e174]:
            - listitem [ref=f111e175]: Pigment and vascular pattern reviewed separately
            - listitem [ref=f111e176]: Recent sun and tanning history considered
            - listitem [ref=f111e177]: Settings selected for skin and target
            - listitem [ref=f111e178]: Combination modalities sequenced when appropriate
          - paragraph [ref=f111e179]: "Treatments are provided under written physician protocol and medical direction.Medical Director: Joshua Shaw, MD · FL Lic. ME136232"
      - generic [ref=f111e181]:
        - generic [ref=f111e182]:
          - paragraph [ref=f111e183]: Combination treatment planning
          - heading "A second modality should have a separate job." [level=2] [ref=f111e184]
          - paragraph [ref=f111e185]: Combination planning is about matching each concern to the right technology and sequencing treatment responsibly. It is not an instruction to perform every modality in the same appointment.
        - generic [ref=f111e186]:
          - article [ref=f111e187]:
            - paragraph [ref=f111e188]: Structure + complexion
            - heading "Morpheus8 + Lumecca Peak" [level=3] [ref=f111e189]
            - generic [ref=f111e190]: Morpheus8 addresses fractional remodeling and texture. Lumecca Peak addresses visible pigment, photodamage, and vascular discoloration. The value is in assigning each concern to the technology built for it.
