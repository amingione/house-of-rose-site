      - generic [ref=f111e51]:
        - generic [ref=f111e52]:
          - generic [ref=f111e53]:
            - paragraph [ref=f111e54]: What the treatment consists of · What IPL is doing
            - heading "Light is absorbed by visible pigment and vascular targets." [level=2] [ref=f111e55]
          - generic [ref=f111e56]:
            - paragraph [ref=f111e57]: IPL is not a laser. It sends filtered, broad-spectrum pulses of light into the skin. Selected wavelengths are absorbed by visible pigment and blood-vessel targets, converting light to heat within those targets.
            - paragraph [ref=f111e58]: Lumecca Peak is InMode’s higher-output IPL handpiece on OptimasMAX, with a custom xenon flash lamp and sapphire cooling tip. Its value is not simply “more power”; it is the ability to select settings after reviewing skin tone, the type of discoloration, the treatment area, and recent sun exposure.
            - paragraph [ref=f111e59]: Brown pigment can temporarily darken after treatment before it flakes or fades. Vascular redness can blanch or change color before settling. Those visible transitions are part of why timing, sun protection, and aftercare matter.
          - generic [ref=f111e60]:
            - generic [ref=f111e61]:
              - term [ref=f111e62]: Brown pigment
              - definition [ref=f111e63]: Sun-related spots and uneven pigmentation absorb selected light energy.
            - generic [ref=f111e64]:
              - term [ref=f111e65]: Visible redness
              - definition [ref=f111e66]: Superficial vascular targets respond through a different light-absorption pathway.
            - generic [ref=f111e67]:
              - term [ref=f111e68]: Cooling + control
              - definition [ref=f111e69]: The sapphire tip and selected pulse settings support a controlled light treatment.
        - figure "InMode manufacturer media" [ref=f111e70]:
          - img "Lumecca Peak intense pulsed light handpiece with sapphire cooling tip"
