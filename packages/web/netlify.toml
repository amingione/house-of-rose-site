# House of Rose — Astro Storefront
# Netlify site: house-of-rose-web (0de4617d-5ba1-4e80-b59e-4900b540f5c0)
# Custom domain: houseofrosefl.com
#
# NOTE: Base directory NOT required in Netlify UI — publish path is absolute from repo root

[build]
  # Content lives in Sanity (edited in Sanity Studio). The build just installs deps and builds
  # the static site, fetching published content at build time. The old Notion→Sanity build-time
  # sync was removed — it wrote dotted _ids that Sanity treats as private/unreadable.
  # The trailing postdeploy-indexnow step pings IndexNow (Bing/Yandex/…) on
  # production deploys only and can never fail the build — see scripts/postdeploy-indexnow.mjs.
  command = "npm install && npm run build -w @house-of-rose/web && node scripts/postdeploy-indexnow.mjs"
  publish = "packages/web/dist"

[functions]
  directory = "packages/web/netlify/functions"

[build.environment]
  # Match monorepo engines floor (Sanity Studio v6 needs Node >=22.12)
  NODE_VERSION = "22"

[context.production.environment]
  # LAUNCHED 2026-07-13 — public production domain is live (was gated by coming-soon).
  PUBLIC_COMING_SOON = "false"

[context.branch-deploy.environment]
  # Branch deploys are for reviewing the real site before launch.
  PUBLIC_COMING_SOON = "false"

[context.deploy-preview.environment]
  PUBLIC_COMING_SOON = "false"

[context."preview".environment]
  PUBLIC_COMING_SOON = "false"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    # X-Frame-Options cannot allow Netlify Visual Editor while also protecting
    # the public site. CSP frame-ancestors provides the narrow allow-list the
    # editor needs without permitting arbitrary third-party framing.
    Content-Security-Policy = "frame-ancestors 'self' https://create.netlify.com"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# vCard — serve inline as text/vcard so iOS opens Contacts (prefilled) on tap,
# instead of downloading a file. Powers the "Save My Contact" button on /amber/.
[[headers]]
  for = "/amber.vcf"
  [headers.values]
    Content-Type        = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"AmberMingione.vcf\""

# vCard — same inline behavior for Diana's card (/diana/).
[[headers]]
  for = "/diana.vcf"
  [headers.values]
    Content-Type        = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"DianaMorrison.vcf\""

# vCard — same inline behavior for Brandy's card (/brandy/).
[[headers]]
  for = "/brandy.vcf"
  [headers.values]
    Content-Type        = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"Brandy.vcf\""

