# House of Rose — Astro Storefront
# Netlify site: house-of-rose-web (0de4617d-5ba1-4e80-b59e-4900b540f5c0)
# Custom domain: houseofrosefl.com
#
# NOTE: Base directory NOT required in Netlify UI — publish path is absolute from repo root

[build]
  # 1. install deps  2. (only when triggered by the content build hook) pull Notion → Sanity
  # 3. build the web package. The sync step no-ops on normal git deploys — see
  # scripts/netlify-content-sync.mjs and docs/publish-button.md.
  command = "npm install && node scripts/netlify-content-sync.mjs && npm run build -w @house-of-rose/web"
  publish = "packages/web/dist"

[functions]
  directory = "packages/web/netlify/functions"

[build.environment]
  # Match monorepo engines floor (Sanity Studio v6 needs Node >=22.12)
  NODE_VERSION = "22"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404 fallback for unknown routes (Astro static output)
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
